name: Clubfindr CI

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'clubfindr/**'
      - '.github/workflows/clubfindr-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'clubfindr/**'
      - '.github/workflows/clubfindr-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clubfindr

    # Seeded test database for the e2e suite. dev/setup.sh finds it on 54329 with the dev
    # credentials, loads schema + synthetic seed and writes a placeholder .env, so no
    # secrets are needed: every external service is blocked in the tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clubfindr_dev
          POSTGRES_PASSWORD: clubfindr_dev
          POSTGRES_DB: clubfindr_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U clubfindr_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    # Version comes from clubfindr/package.json `packageManager`
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: clubfindr/package.json

    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: clubfindr/.nvmrc
        cache: 'pnpm'
        cache-dependency-path: clubfindr/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Seed test database and write .env
      run: dev/setup.sh

    - name: Run linter
      run: pnpm lint

    - name: Run type check
      run: pnpm check

    - name: Run unit tests
      run: pnpm exec vitest run

    - name: Build
      run: pnpm build

    - name: Install Playwright browser
      run: pnpm exec playwright install --with-deps chromium

    - name: Run E2E tests
      run: pnpm test
      env:
        PW_SKIP_BUILD: '1'

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: clubfindr/playwright-report/
        retention-days: 30
