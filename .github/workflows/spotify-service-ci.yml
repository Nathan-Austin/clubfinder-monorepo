name: Spotify Service CI

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'spotify_service/**'
      - '.github/workflows/spotify-service-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'spotify_service/**'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: spotify_service

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium flask requests python-dotenv psycopg2-binary

    - name: Run linting
      run: |
        pip install flake8 black
        flake8 *.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 *.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        black --check *.py

    - name: Validate service configuration
      run: |
        # Check if required files exist
        test -f SpotifyUserManagementService.py || exit 1
        test -f cleanup.py || exit 1
        test -f manage_spotify_service.sh || exit 1

    - name: Validate shell scripts
      run: |
        pip install shellcheck-py
        shellcheck manage_spotify_service.sh || echo "shellcheck warnings found"
      continue-on-error: true

    - name: Security scan
      run: |
        pip install bandit
        bandit -r . -ll
      continue-on-error: true
