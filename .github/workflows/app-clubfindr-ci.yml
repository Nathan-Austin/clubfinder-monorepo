name: App Clubfindr CI

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'app_clubfindr/**'
      - '.github/workflows/app-clubfindr-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app_clubfindr/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_clubfindr

    steps:
    - uses: actions/checkout@v4

    # React Native 0.81 / Metro need Node >= 20.19.4; same major as clubfindr
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: app_clubfindr/.nvmrc
        cache: 'npm'
        cache-dependency-path: app_clubfindr/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Errors fail the build; the many existing warnings (mostly `any`) do not
    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Unit tests
      run: npm test -- --ci

    # Bundles the whole app for Android the way a release build does, so a broken import,
    # a missing module or a syntax error Metro rejects fails here, without a device
    - name: Build the Android bundle
      run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"

    # Report only: it currently flags Expo packages a patch behind the SDK
    # (`npx expo install --check`), which is upgrade work, not a broken build
    - name: Expo doctor (report only)
      run: npx expo-doctor
      continue-on-error: true
