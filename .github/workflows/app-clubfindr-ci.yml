name: App Clubfindr CI

on:
  workflow_call:
  push:
    branches: [ main, develop ]
    paths:
      - 'app_clubfindr/**'
      - '.github/workflows/app-clubfindr-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app_clubfindr/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app_clubfindr

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: app_clubfindr/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Run type check
      run: npx tsc --noEmit
      continue-on-error: true

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Check Expo configuration
      run: npx expo-doctor
      continue-on-error: true

  # Optional: Build for specific platforms
  build-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: app_clubfindr

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Install dependencies
      run: npm ci

    - name: Build preview
      run: npx expo export
      continue-on-error: true
