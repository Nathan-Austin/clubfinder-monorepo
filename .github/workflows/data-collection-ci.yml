name: Data Collection CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'data_collection/**'
      - '.github/workflows/data-collection-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'data_collection/**'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data_collection

    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: data_collection/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8 black
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        black --check .

    - name: Validate configuration files
      run: |
        # Check if required files exist
        test -f live_cities.txt || echo "Warning: live_cities.txt not found"
        test -f utils.py || exit 1
        test -f data_collection.py || exit 1

    - name: Security scan
      run: |
        pip install bandit
        bandit -r . -ll
      continue-on-error: true
