name: Deploy to Server

# Deploys main to production after Main CI has passed for that commit.
# The server-side logic lives in deploy/deploy.sh (taken from the commit being
# deployed): preflight checks, fast-forward, rebuild/restart only what changed,
# health checks. Python requirements and deploy/ files are applied by hand.

on:
  workflow_run:
    workflows: ["Main CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DEPLOY_SHA
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /home/nathan/clubfinder
            git fetch --quiet origin main
            script=$(mktemp)
            trap 'rm -f "$script"' EXIT
            git show "${DEPLOY_SHA}:deploy/deploy.sh" > "$script"
            bash "$script" "$DEPLOY_SHA"
