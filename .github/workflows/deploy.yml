name: Deploy to Server

on:
  push:
    branches: [main]
    paths:
      - 'clubfindr/**'
      - 'barfindr/**'
      - 'data_collection/**'
      - 'spotify_service/**'
      # Explicitly exclude app_clubfindr - it only goes to GitHub, not server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            clubfindr:
              - 'clubfindr/**'
            barfindr:
              - 'barfindr/**'
            data_collection:
              - 'data_collection/**'
            spotify_service:
              - 'spotify_service/**'

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/nathan/clubfinder

            echo "=== Pulling latest changes ==="
            git pull origin main

            # Install/build for changed components
            if [ "${{ steps.changes.outputs.clubfindr }}" == "true" ]; then
              echo "=== Building clubfindr ==="
              cd /home/nathan/clubfinder/clubfindr
              pnpm install --frozen-lockfile
              pnpm build
              cd /home/nathan/clubfinder
            fi

            if [ "${{ steps.changes.outputs.barfindr }}" == "true" ]; then
              echo "=== Installing barfindr dependencies ==="
              cd /home/nathan/clubfinder/barfindr
              pip install -r requirements.txt
              cd /home/nathan/clubfinder
            fi

            if [ "${{ steps.changes.outputs.data_collection }}" == "true" ]; then
              echo "=== Installing data_collection dependencies ==="
              cd /home/nathan/clubfinder/data_collection
              pip install -r requirements.txt
              cd /home/nathan/clubfinder
            fi

            if [ "${{ steps.changes.outputs.spotify_service }}" == "true" ]; then
              echo "=== Installing spotify_service dependencies ==="
              cd /home/nathan/clubfinder/spotify_service
              pip install -r requirements.txt
              cd /home/nathan/clubfinder
            fi

            echo "=== Restarting services ==="

            # Restart clubfindr (PM2) only if it changed
            if [ "${{ steps.changes.outputs.clubfindr }}" == "true" ]; then
              echo "Restarting clubfindr via PM2..."
              pm2 restart clubfindr || pm2 start /home/nathan/clubfinder/clubfindr/ecosystem.config.cjs
              pm2 save
            fi

            # Restart barfindr services (systemd) only if it changed
            if [ "${{ steps.changes.outputs.barfindr }}" == "true" ]; then
              echo "=== Updating barfindr systemd services ==="
              sudo cp /home/nathan/clubfinder/barfindr/systemd/barfindr.service /etc/systemd/system/
              sudo cp /home/nathan/clubfinder/barfindr/systemd/barfindr-celery-worker.service /etc/systemd/system/
              sudo cp /home/nathan/clubfinder/barfindr/systemd/barfindr-celery-beat.service /etc/systemd/system/
              sudo systemctl daemon-reload

              echo "Restarting barfindr services..."
              sudo systemctl restart barfindr.service
              sudo systemctl restart barfindr-celery-worker.service
              sudo systemctl restart barfindr-celery-beat.service

              echo "Verifying barfindr deployment..."
              sleep 5
              if ! systemctl is-active --quiet barfindr.service; then echo "❌ barfindr.service failed"; exit 1; fi
              if ! systemctl is-active --quiet barfindr-celery-worker.service; then echo "❌ barfindr-celery-worker.service failed"; exit 1; fi
              if ! systemctl is-active --quiet barfindr-celery-beat.service; then echo "❌ barfindr-celery-beat.service failed"; exit 1; fi
              echo "✅ All barfindr services are active."
            fi

            # Restart spotify_service (systemd) only if it changed
            if [ "${{ steps.changes.outputs.spotify_service }}" == "true" ]; then
              echo "Restarting spotify_service..."
              sudo systemctl restart spotify-service.service
            fi

            echo "=== Deployment complete ==="
