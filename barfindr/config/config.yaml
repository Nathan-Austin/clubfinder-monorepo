database:
  host: 172.17.0.1
  port: 5432
  name: clubfindr
  user: nathan
  password: nathan

logging:
  level: INFO
  file: /app/logs/barfindr.log

music_services:
  spotify:
    client_id: ${SPOTIFY_CLIENT_ID}
    client_secret: ${SPOTIFY_CLIENT_SECRET}
    polling_interval: 300 # 5 minutes in seconds
    active_hours:
      start: "18:00" # 6 PM
      end: "03:00" # 3 AM

background_tasks:
  worker_count: 2 # Reduced for your server resources
  queue_name: barfindr_tasks

monitoring:
  log_metrics: true
  memory_limit: 512 # MB
