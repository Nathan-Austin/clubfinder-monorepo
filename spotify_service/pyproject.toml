[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify_automation"
version = "0.1.0"
description = "Spotify Automation Service for Clubfinder"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "selenium",
    "webdriver-manager",
    "requests",
    "flask",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "sqlalchemy>=2.0.23",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true