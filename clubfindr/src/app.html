<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

		<!-- Primary Meta Tags -->
		<meta name="title" content="ClubFindr - Find Your Perfect Night Out" />
		<meta
			name="description"
			content="Discover the best clubs and bars based on your music taste. Connect with venues that match your style."
		/>
		<meta
			name="keywords"
			content="nightlife, clubs, bars, music, events, nightclub finder, bar finder, music venues"
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="ClubFindr - Find Your Perfect Night Out" />
		<meta
			property="og:description"
			content="Discover the best clubs and bars based on your music taste"
		/>
		<meta property="og:image" content="%sveltekit.assets%/images/clubfindr.png" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ClubFindr - Find Your Perfect Night Out" />
		<meta
			name="twitter:description"
			content="Discover the best clubs and bars based on your music taste"
		/>
		<meta name="twitter:image" content="%sveltekit.assets%/images/clubfindr.png" />

		<!-- Mobile & PWA -->
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- SEO -->
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://clubfindr.com%sveltekit.url%" />

		<!-- Favicon -->
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
